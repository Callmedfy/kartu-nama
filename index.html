<title>Kartu Nama Gantung</title>
<style>
/* Tinggi embed di Figma Sites sebaiknya 560px ke atas. Background transparan. */
html,body{margin:0;height:100%;overscroll-behavior:auto;background:transparent!important;color-scheme:light dark;overflow:hidden}
#stage{pointer-events:none;touch-action:pan-y;position:relative;width:100%;height:100%;perspective:1100px;overflow:hidden;-webkit-user-select:none;user-select:none}
#card{pointer-events:auto;position:absolute;left:0;top:0;transform-style:preserve-3d;cursor:grab;touch-action:none;will-change:transform;font-family:"Helvetica Neue",Arial,sans-serif}
#card.drag{cursor:grabbing}
.face{position:absolute;inset:0;border-radius:10.4%/7.8%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 22px 40px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.08) inset}
.face img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.back{transform:rotateY(180deg);background:radial-gradient(120% 80% at 15% 100%,rgba(255,45,35,.38),transparent 60%),#262626;color:#fff}
.back .frame{position:absolute;inset:5%;border:.18em solid #ff3b30;border-radius:8%/6%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;text-align:center}
.back b{font-size:1.9em;line-height:1.1;letter-spacing:-.01em}
.back span{font-size:.8em;color:#ff6b61;letter-spacing:.06em}
.back i{width:2.4em;height:.16em;background:#ff3b30;border-radius:9px}
.gloss{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit}
.gloss i{position:absolute;top:-30%;height:160%;left:0;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.gloss .gl{width:70%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.2) 50%,rgba(255,255,255,0))}
.gloss .gs{width:26%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5) 50%,rgba(255,255,255,0))}
.gloss .gr{left:-10%;top:-30%;width:120%;height:90%;background:radial-gradient(closest-side,rgba(255,255,255,.2),rgba(255,255,255,0))}
#rope{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style>

<script>
(function(){
/* ===== Pengaturan (ubah di sini) ===== */
var GRAVITY=.55;      // makin besar makin berat
var DAMPING=.992;     // makin kecil makin cepat berhenti berayun
var DRAG_STRENGTH=.2; // sensitivitas tarikan (0.1 lembut - 0.4 responsif)
var SPIN_SENS=.001;   // sensitivitas putaran saat digeser ke samping
var FLIP_SPEED=.014;  // kecepatan flip (0.008 pelan - 0.025 cepat)
var SWEEP_EVERY=7;    // detik, jeda kilau otomatis
/* ===================================== */
var stage=document.getElementById('stage'),card=document.getElementById('card'),
cv=document.getElementById('rope'),ctx=cv.getContext('2d'),N=12,PI=Math.PI;
var flipTo=null,W,H,cardW,cardH,segLen,P,A,B,drag=null,s=0,sv=0,ts=0,last=0,acc=0;
var gls=card.querySelectorAll('.gl'),gss=card.querySelectorAll('.gs'),grs=card.querySelectorAll('.gr');
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function init(){
  var r=stage.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  cardH=Math.max(180,Math.min(H*.52,400));cardW=cardH*383/516;
  if(cardW>W*.8){cardW=W*.8;cardH=cardW*516/383}
  card.style.width=cardW+'px';card.style.height=cardH+'px';card.style.fontSize=(cardW/20)+'px';
  var rope=Math.max(50,Math.min(H*.26,H-cardH-30));segLen=rope/(N-1);
  P=[];
  for(var i=0;i<N;i++)P.push({x:W/2,y:-6+i*segLen,px:W/2,py:-6+i*segLen,im:i?1:0});
  A=P[N-1];A.im=.5;
  B={x:W/2+30,y:A.y+cardH,px:W/2+30,py:A.y+cardH,im:.12};
  P.push(B);
}
function solve(a,b,len){
  var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1e-4,w=a.im+b.im;
  if(!w)return;var f=(d-len)/d;
  a.x+=dx*f*a.im/w;a.y+=dy*f*a.im/w;b.x-=dx*f*b.im/w;b.y-=dy*f*b.im/w;
}
function step(){
  var i,p;
  for(i=0;i<P.length;i++){p=P[i];if(!p.im)continue;
    var vx=(p.x-p.px)*DAMPING,vy=(p.y-p.py)*DAMPING;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+GRAVITY;}
  if(drag){
    var t=drag.t,sx=A.x+(B.x-A.x)*t,sy=A.y+(B.y-A.y)*t;
    var dx=(drag.x-drag.ox-sx)*DRAG_STRENGTH,dy=(drag.y-drag.oy-sy)*DRAG_STRENGTH,m=Math.hypot(dx,dy);
    if(m>14){dx*=14/m;dy*=14/m}
    A.x+=dx*(1-t);A.y+=dy*(1-t);B.x+=dx*t;B.y+=dy*t;
  }
  for(var k=0;k<16;k++){
    for(i=0;i<N-1;i++)solve(P[i],P[i+1],segLen);
    solve(A,B,cardH);
  }
  for(i=1;i<P.length;i++){p=P[i];
    if(p.x<10){p.x=10}else if(p.x>W-10){p.x=W-10}
    if(p.y>H-10)p.y=H-10;}
  // putaran (flip)
  sv+=(B.x-B.px)*.0003;
  if(flipTo!==null){ts=flipTo;if(Math.abs(ts-s)<.05&&Math.abs(sv)<.01)flipTo=null}
  else if(Math.abs(sv)>.02)ts=Math.round((s+sv*8)/PI)*PI;else ts=Math.round(s/PI)*PI;
  sv+=(ts-s)*FLIP_SPEED;sv*=.88;s+=sv;
}
function render(now){
  var dx=B.x-A.x,dy=B.y-A.y,d=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/d,uy=dy/d,
  rot=-Math.atan2(ux,uy),cx=A.x+ux*(cardH/2+4),cy=A.y+uy*(cardH/2+4),deg=rot*57.3;
  card.style.transform='translate('+(cx-cardW/2)+'px,'+(cy-cardH/2)+'px) rotate('+rot+'rad) rotateY('+s+'rad)';
  var ph=((now/1000)%SWEEP_EVERY)/1.6,
  gx=Math.max(-1,Math.min(2,.5+deg*.025+Math.sin(s)*.55)),
  gs=(reduce||ph>1)?-2:ph*1.9-.6,
  rx=Math.max(-.4,Math.min(.4,deg*.012+Math.sin(s)*.3));
  for(var q=0;q<gls.length;q++){
    gls[q].style.transform='translate3d('+((gx-.35)/.7*100).toFixed(2)+'%,0,0) skewX(-18deg)';
    gss[q].style.transform='translate3d('+((gs-.13)/.26*100).toFixed(2)+'%,0,0) skewX(-18deg)';
    grs[q].style.transform='translate3d('+(rx*100/1.2).toFixed(2)+'%,0,0)';
  }
  // tali manik-manik
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#f1f1f1';
  for(var i=0;i<N-1;i++){
    for(var k=0;k<3;k++){var f=k/3,x=P[i].x+(P[i+1].x-P[i].x)*f,y=P[i].y+(P[i+1].y-P[i].y)*f;
      ctx.beginPath();ctx.arc(x,y,2.1,0,7);ctx.fill();}
  }
  // cincin & klip
  var rx=A.x+ux*5,ry=A.y+uy*5;
  ctx.save();ctx.translate(rx,ry);ctx.rotate(rot);
  ctx.strokeStyle='#c9c9c9';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(0,-2,7.5,0,7);ctx.stroke();
  var g=ctx.createLinearGradient(-6,0,6,0);g.addColorStop(0,'#6d6d6d');g.addColorStop(.5,'#d8d8d8');g.addColorStop(1,'#6d6d6d');
  ctx.fillStyle=g;ctx.fillRect(-6,3,12,12);ctx.restore();
}
function loop(now){
  var dt=Math.min(50,now-(last||now));last=now;acc+=dt;
  while(acc>=16.667){step();acc-=16.667}
  render(now);requestAnimationFrame(loop);
}
// interaksi
var down=null;
function pt(e){var r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
card.addEventListener('pointerdown',function(e){
  var p=pt(e),vx=B.x-A.x,vy=B.y-A.y,t=((p.x-A.x)*vx+(p.y-A.y)*vy)/(vx*vx+vy*vy);
  t=Math.max(0,Math.min(1,t));
  drag={t:t,x:p.x,y:p.y,ox:p.x-(A.x+vx*t),oy:p.y-(A.y+vy*t)};
  down={x:p.x,y:p.y,t:performance.now()};
  card.classList.add('drag');card.setPointerCapture(e.pointerId);e.preventDefault();
});
card.addEventListener('pointermove',function(e){
  if(!drag)return;var p=pt(e);
  flipTo=null;sv+=Math.max(-.1,Math.min(.1,(p.x-drag.x)*SPIN_SENS));
  drag.x=p.x;drag.y=p.y;
});
function up(e){
  if(!drag)return;var p=pt(e);
  if(down&&Math.hypot(p.x-down.x,p.y-down.y)<6&&performance.now()-down.t<350)flipTo=Math.round(s/PI)*PI+PI; // klik = balik kartu
  drag=null;card.classList.remove('drag');
}
card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);
// teruskan scroll mouse/trackpad ke halaman induk (bekerja bila embed satu origin dengan halaman)
addEventListener('wheel',function(e){
  try{
    var el=window.frameElement,dy=e.deltaY;
    while(el){
      var v=el.ownerDocument.defaultView,o=v.getComputedStyle(el).overflowY;
      if(el.scrollHeight>el.clientHeight+1&&/(auto|scroll|overlay)/.test(o)){el.scrollTop+=dy;return}
      el=el.parentElement;
    }
    if(window.parent&&window.parent!==window)window.parent.scrollBy(0,dy);
  }catch(err){}
},{passive:true});
var rz;addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(init,150)});
init();requestAnimationFrame(loop);
})();
</script>
